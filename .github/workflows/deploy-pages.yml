name: Publish UI Style Lab to gh-pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - name: Install
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Quality checks
        run: npm run lint && npm run typecheck && npm test
      - name: Install visual test browser
        run: npx playwright install --with-deps chromium
      - name: Visual and accessibility review packs
        run: npm run test:e2e
      - name: Build static site
        run: npm run build:pages
      - name: Publish static branch
        run: |
          cp -R gh-pages "$RUNNER_TEMP/ui-style-lab-pages"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch --orphan gh-pages
          git clean -fdx
          cp -R "$RUNNER_TEMP/ui-style-lab-pages"/. .
          touch .nojekyll
          git add --all
          git commit -m "Deploy ${GITHUB_SHA}"
          git push --force origin gh-pages
